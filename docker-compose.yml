services:
  aspnet:
    build: .
    container_name: restaurantordermonolith
    ports:
      - "8083:8080"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=postgres;Port=5432;Database=restaurantorderingplatformmonolith;Username=postgres;Password=postgres"
    networks:
      - aspnetdocker_default

networks:
  aspnetdocker_default:
    external: true